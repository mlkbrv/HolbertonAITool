databases:
  - name: giftai-db
    plan: free
    databaseName: giftai
    user: giftai

services:
  - type: web
    name: giftai
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: chmod +x scripts/*.sh && ./scripts/build.sh
    startCommand: ./scripts/start.sh
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: DATABASE_URL
        fromDatabase:
          name: giftai-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: RENDER
        value: "true"
