databases:
  - name: giftai-db
    plan: free
    databaseName: giftai
    user: giftai

services:
  - type: web
    name: giftai-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: chmod +x scripts/*.sh && API_ONLY=true ./scripts/build.sh
    startCommand: ./scripts/start.sh
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: DATABASE_URL
        fromDatabase:
          name: giftai-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: RENDER
        value: "true"
      - key: API_ONLY
        value: "true"
      - key: FRONTEND_URL
        value: https://giftai-frontend.onrender.com
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_REASONING_EFFORT
        value: medium

  - type: web
    name: giftai-frontend
    runtime: static
    buildCommand: chmod +x scripts/build-frontend.sh && ./scripts/build-frontend.sh
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_ORIGIN
        value: https://giftai-api.onrender.com
      - key: VITE_SHOW_TEST_TOOLS
        value: "true"
